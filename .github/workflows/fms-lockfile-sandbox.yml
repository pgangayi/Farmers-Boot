name: FMS lockfile sandbox

on:
  pull_request:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Generate lockfile
        working-directory: fms-lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - uses: actions/upload-artifact@v4
        with:
          name: fms-drizzle-v1-lockfile
          path: fms-lockfile/pnpm-lock.yaml
